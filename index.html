<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>揪汪汪家 · 点餐工作台</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="authView" class="auth-view hidden">
  <div class="auth-card">
    <div class="auth-emoji">🍱</div>
    <h1>揪汪汪家点餐工作台</h1>
    <p class="sub">全家一起点今天吃什么～</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">登录</button>
      <button class="tab-btn" data-tab="register">注册新账号</button>
    </div>

    <form id="loginForm" class="tab-panel">
      <input type="text" id="loginUsername" placeholder="用户名" required />
      <input type="password" id="loginPassword" placeholder="密码" required />
      <button type="submit" class="primary-btn">登录 🐾</button>
      <div class="form-error" id="loginError"></div>
    </form>

    <form id="registerForm" class="tab-panel hidden">
      <input type="text" id="regUsername" placeholder="用户名" required />
      <input type="text" id="regDisplayName" placeholder="昵称（比如：妈妈 / 爸爸）" required />
      <input type="password" id="regPassword" placeholder="密码" required />
      <button type="submit" class="primary-btn">注册并进入 🎉</button>
      <div class="form-error" id="registerError"></div>
    </form>
  </div>
</div>

<div id="mainView" class="main-view hidden">
  <header class="topbar">
    <div class="brand">🍱 揪汪汪家点餐工作台</div>
    <div class="user-box">
      <input type="date" id="datePicker" />
      <span id="whoAmI" class="who"></span>
      <button id="logoutBtn" class="ghost-btn">退出</button>
    </div>
  </header>

  <main class="layout">
    <section class="pantry">
      <h2>🧺 食材仓库</h2>
      <form id="addIngredientForm" class="add-form">
        <input type="text" id="ingName" placeholder="食材名字，比如：鸡肉" required />
        <select id="ingCategory">
          <option value="meat">🍖 肉类</option>
          <option value="vegetable">🥦 蔬菜</option>
          <option value="fruit">🍎 水果</option>
          <option value="staple">🍚 主食</option>
          <option value="dairy">🥛 奶制品</option>
          <option value="other">🍽️ 其它</option>
        </select>
        <button type="submit" class="primary-btn small">发布</button>
      </form>
      <div id="ingredientList" class="ingredient-list"></div>
    </section>

    <section class="board">
      <h2>📅 今日点餐</h2>
      <p class="hint">把食材仓库里的卡片拖到下面的框框里～</p>
      <div class="slots-grid">
        <div class="slot-card baby" data-slot="baby_breakfast">
          <div class="slot-title">🍼 揪汪汪 · 早餐</div>
          <div class="slot-drop" data-slot="baby_breakfast"></div>
        </div>
        <div class="slot-card baby" data-slot="baby_dinner">
          <div class="slot-title">🌙🍼 揪汪汪 · 晚餐</div>
          <div class="slot-drop" data-slot="baby_dinner"></div>
        </div>
        <div class="slot-card adult" data-slot="adult_breakfast">
          <div class="slot-title">☀️ 大人 · 早餐</div>
          <div class="slot-drop" data-slot="adult_breakfast"></div>
        </div>
        <div class="slot-card adult" data-slot="adult_dinner">
          <div class="slot-title">🌙 大人 · 晚餐</div>
          <div class="slot-drop" data-slot="adult_dinner"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
